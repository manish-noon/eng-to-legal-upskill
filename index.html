<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Engineer to Legal · Courses</title>
  <script src="shared/theme.js"></script>
  <link rel="stylesheet" href="shared/style.css">
  <link rel="stylesheet" href="shared/catalog.css">
</head>
<body>
  <main class="catalog">
    <nav class="catalog-nav" aria-label="Site navigation"><b>Engineer to Legal</b><a href="#list">Courses</a><button class="iconbtn" data-themebtn title="Theme"></button></nav>
    <header class="catalog-head"><h1>Legal practice<br><em>for engineers</em></h1><p>Learn to read the agreement, trace the money, and make the call. Self-paced courses built around real transaction documents.</p></header>
    <h2>Courses</h2>
    <div id="list"></div>
  </main>
  <script>
    async function listCourses() {
      const response = await fetch('courses.json');
      if (!response.ok) throw new Error('Course list unavailable.');
      const courses = await response.json();
      for (const course of courses) {
        const article = document.createElement('article');
        article.className = 'edition';
        const link = document.createElement('a');
        link.href = course.path;
        if (course.cover) {
          const photo = document.createElement('img');
          photo.alt = '';
          photo.src = course.cover;
          link.append(photo);
        }
        const copy = document.createElement('div');
        copy.className = 'edition-copy';
        const topic = document.createElement('span');
        topic.className = 'kicker';
        topic.textContent = course.subtitle;
        const title = document.createElement('h3');
        title.textContent = course.title;
        const description = document.createElement('p');
        description.textContent = course.description;
        const meta = document.createElement('small');
        meta.textContent = course.modules + ' modules · ' + course.hours;
        copy.append(topic,title,description,meta);
        link.append(copy);
        article.append(link);
        if (course.podcast) {
          const audio = document.createElement('a');
          audio.className = 'edition-audio';
          audio.href = course.podcast;
          audio.textContent = 'Listen to the podcast →';
          audio.setAttribute('aria-label', course.title + ' podcast');
          article.append(audio);
        }
        document.getElementById('list').append(article);
      }
    }
    listCourses().catch(()=>document.getElementById('list').textContent='The course catalog could not load. Refresh to try again.');
  </script>
</body>
</html>
