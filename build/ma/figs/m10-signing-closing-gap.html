<figure class="diagram"><svg viewBox="0 0 680 336" role="img" aria-labelledby="m10f1-t m10f1-d"><title id="m10f1-t">The gap between signing and closing</title><desc id="m10f1-d">A timeline from signing to closing. During the gap, conditions precedent run in parallel: regulatory approvals, third-party consents, financing and reorganisations. Closing follows once the last condition is satisfied or waived. If conditions are not met by the long-stop date, either party may typically terminate, unless its own breach caused the failure. Other walk rights: a MAC if agreed, sometimes a material breach found before closing, and failure by the other side to perform at closing.</desc>
<line class="ln" x1="40" y1="60" x2="600" y2="60"/><polygon class="arr" points="612,60 600,54 600,66"/>
<rect class="fink" x="36" y="52" width="10" height="16"/><text x="20" y="40" class="tb">Signing</text><text x="20" y="88" class="ts tm">Parties bound</text>
<rect class="fa" x="436" y="52" width="10" height="16"/><text x="400" y="40" class="tb ta">Closing</text><text x="384" y="88" class="ts tm">Shares and money move</text>
<line class="lnbad" x1="540" y1="30" x2="540" y2="230"/><text x="548" y="40" class="tb tbad">Long-stop</text><text x="548" y="56" class="ts tbad">date</text>
<text x="60" y="118" class="tl">Conditions precedent (if-guards on closing)</text>
<rect class="fas" x="60" y="128" width="320" height="18"/><text x="68" y="141" class="ts">Regulatory approvals (merger control, FDI, sector)</text>
<rect class="fas" x="60" y="152" width="200" height="18"/><text x="68" y="165" class="ts">Third-party consents</text>
<rect class="fas" x="60" y="176" width="250" height="18"/><text x="68" y="189" class="ts">Financing</text>
<rect class="fas" x="60" y="200" width="290" height="18"/><text x="68" y="213" class="ts">Reorganisations / carve-out</text>
<line class="lnd" x1="380" y1="128" x2="380" y2="230"/><text x="300" y="244" class="ts tm">last CP satisfied or waived → close</text>
<rect class="box" x="20" y="262" width="640" height="62"/><text x="32" y="282" class="tl">Walk rights in the gap (deliberately few)</text>
<text x="32" y="300" class="ts">CPs unmet by the long-stop date (not for the party at fault) · a MAC, if agreed</text><text x="32" y="316" class="ts">Sometimes a material breach found before closing · the other side fails to perform at closing</text>
</svg><figcaption><b>Figure 1.</b> Signing binds the parties; closing executes only when every condition is true. The long-stop date is the deadline, and termination rights are the only exits.</figcaption></figure>
