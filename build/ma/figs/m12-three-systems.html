<figure class="diagram"><svg viewBox="0 0 680 400" role="img" aria-labelledby="m12f1-t m12f1-d"><title id="m12f1-t">The UAE's three legal systems and the three deal questions</title><desc id="m12f1-d">Three columns: onshore UAE civil law with Arabic-language local and federal courts and notarised share transfer; DIFC common law under its own statutes with English-language DIFC Courts and a transfer form; ADGM English common law applied directly with English-language ADGM Courts. Below, three questions: where the target is incorporated is a fact that fixes transfer mechanics; which law governs the SPA is a choice, typically English, DIFC or ADGM law; where disputes go is a choice, typically arbitration under DIAC, ICC or LCIA rules, with DIFC-seated awards enforced onshore through the DIFC Courts by the conduit route.</desc>
<rect class="box" x="20" y="20" width="200" height="140"/><text x="32" y="44" class="tb">Onshore (mainland)</text><text x="32" y="70" class="ts">UAE civil law (codes)</text><text x="32" y="90" class="ts">Local and federal courts,</text><text x="32" y="106" class="ts">in Arabic</text><text x="32" y="130" class="ts tm">Transfer: notarised, MOA</text><text x="32" y="146" class="ts tm">amended, licence updated</text>
<rect class="box" x="240" y="20" width="200" height="140"/><text x="252" y="44" class="tb">DIFC</text><text x="252" y="70" class="ts">Common law, DIFC statutes</text><text x="252" y="90" class="ts">DIFC Courts, in English</text><text x="252" y="130" class="ts tm">Transfer form, register</text><text x="252" y="146" class="ts tm">updated</text>
<rect class="box" x="460" y="20" width="200" height="140"/><text x="472" y="44" class="tb">ADGM</text><text x="472" y="70" class="ts">English common law,</text><text x="472" y="86" class="ts">applied directly</text><text x="472" y="106" class="ts">ADGM Courts, in English</text><text x="472" y="130" class="ts tm">Transfer, register updated</text>
<text x="20" y="190" class="tl">Three questions, answered separately</text>
<rect class="fwarns" x="20" y="200" width="200" height="110"/><text x="32" y="222" class="tb">1. Incorporation</text><text x="32" y="240" class="ts twarn">FACT</text><text x="32" y="262" class="ts">Fixes how title moves:</text><text x="32" y="278" class="ts">onshore LLC needs a short</text><text x="32" y="294" class="ts">Arabic instrument for notary</text>
<rect class="fas" x="240" y="200" width="200" height="110"/><text x="252" y="222" class="tb">2. SPA governing law</text><text x="252" y="240" class="ts ta">CHOICE</text><text x="252" y="262" class="ts">Typical: English, DIFC or</text><text x="252" y="278" class="ts">ADGM law, so the SPA</text><text x="252" y="294" class="ts">machinery works as drafted</text>
<rect class="fas" x="460" y="200" width="200" height="110"/><text x="472" y="222" class="tb">3. Disputes and enforcement</text><text x="472" y="240" class="ts ta">CHOICE</text><text x="472" y="262" class="ts">Typical: arbitration</text><text x="472" y="278" class="ts">(DIAC, ICC or LCIA rules)</text><text x="472" y="294" class="ts">enforced where assets are</text>
<rect class="box2" x="20" y="330" width="640" height="54"/><text x="32" y="352" class="ts tb">Conduit route:</text>
<text x="130" y="352" class="ts">DIFC-seated award</text><line class="ln" x1="236" y1="348" x2="262" y2="348"/><polygon class="arr" points="270,348 262,343 262,353"/>
<text x="278" y="352" class="ts">DIFC Courts</text><line class="ln" x1="350" y1="348" x2="376" y2="348"/><polygon class="arr" points="384,348 376,343 376,353"/>
<text x="392" y="352" class="ts">onshore enforcement</text><text x="32" y="374" class="ts tm">Ask counsel how the route works in current practice.</text>
</svg><figcaption><b>Figure 1.</b> Where the target sits is a fact; the SPA's law and the dispute forum are choices. The typical structure picks a common-law SPA, arbitration, and a short local transfer document.</figcaption></figure>
