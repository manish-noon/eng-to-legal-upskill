<figure class="diagram"><svg viewBox="0 0 680 188" role="img" aria-labelledby="m15f1-t m15f1-d"><title id="m15f1-t">Kept risk for one VAT risk under three sets of terms</title><desc id="m15f1-d">Expected loss of 360 thousand dirhams. Under an 18 month time limit all of it is kept; with a 24 month limit or a specific VAT indemnity none of it is kept.</desc>
<text x="10" y="18" class="tb">Expected loss p × L = 0.3 × AED 1.2m = AED 360k</text>
<text x="10" y="48" class="ts tb">General warranty, 18-month limit</text>
<text x="10" y="62" class="ts tm">claim at month 20 is out of time</text>
<rect x="250" y="38" width="300" height="22" class="fbads"/>
<text x="560" y="54" class="tn tbad">kept AED 360k</text>
<text x="10" y="92" class="ts tb">Time limit extended to 24 months</text>
<text x="10" y="106" class="ts tm">in time, clears basket, under cap</text>
<rect x="250" y="82" width="300" height="22" class="foks"/>
<text x="560" y="98" class="tn tok">kept AED 0</text>
<text x="10" y="136" class="ts tb">Specific VAT indemnity</text>
<text x="10" y="150" class="ts tm">outside the general limits</text>
<rect x="250" y="126" width="300" height="22" class="foks"/>
<text x="560" y="142" class="tn tok">kept AED 0</text>
<rect x="250" y="168" width="10" height="10" class="foks"/>
<text x="266" y="177" class="ts tm">recovered (weighted by p)</text>
<rect x="440" y="168" width="10" height="10" class="fbads"/>
<text x="456" y="177" class="ts tm">kept by the buyer</text>
</svg><figcaption><b>Figure 1.</b> The worked example: price AED 76m, VAT risk p = 30%, L = AED 1.2m, surfacing at month 20. Six more months on the time limit, or a VAT indemnity, each move AED 360k of expected loss from the buyer to the seller.</figcaption></figure>
