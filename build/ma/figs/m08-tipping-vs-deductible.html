.6">140</text><rect class="fa" x="100" y="58" width="12" height="3"/><text class="ts" x="118" y="63">Tipping: first dollar once over</text><rect class="fbad" x="100" y="76" width="12" height="3"/><text class="ts" x="118" y="81">Deductible: only the excess</text></svg><figcaption><b>Figure 2.</b> Same basket, two payouts. Above the 760k threshold the lines stay exactly one basket apart until the cap (15.2m, off this scale) flattens both.</figcaption></figure>
