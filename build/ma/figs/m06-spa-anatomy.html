<figure class="diagram"><svg viewBox="0 0 680 380" role="img" aria-labelledby="m06f1-t m06f1-d"><title id="m06f1-t">Anatomy of an SPA</title><desc id="m06f1-d">The parts of a share purchase agreement arranged by deal state: definitions on top feed everything; sale, conditions, covenants and termination govern signing and the gap; price and closing deliverables meet at closing; warranties, limitations, indemnities and restrictive covenants govern claims after closing; schedules and boilerplate sit underneath. Money sits in price, warranties, limitations and indemnities.</desc><rect class="box2" x="20" y="20" width="640" height="38"/><text class="tb" x="30" y="36">Definitions</text><text class="ts tm" x="30" y="51">the meaning of every capitalised word; much of the money hides here</text><text class="tl" x="20" y="82">Signing and the gap</text><text class="tl" x="250" y="82">Closing</text><text class="tl" x="450" y="82">After closing: claims</text><rect class="box" x="20" y="90" width="210" height="38"/><text class="tb" x="30" y="106">Sale and purchase</text><text class="ts tm" x="30" y="121">full title, free of others’ rights</text><rect class="fwarns" x="20" y="136" width="210" height="38"/><text class="tb" x="30" y="152">Conditions</text><text class="ts tm" x="30" y="167">what must happen before closing</text><rect class="box" x="20" y="182" width="210" height="38"/><text class="tb" x="30" y="198">Pre-closing covenants</text><text class="ts tm" x="30" y="213">how the seller runs the gap</text><rect class="fwarns" x="20" y="228" width="210" height="38"/><text class="tb" x="30" y="244">Termination</text><text class="ts tm" x="30" y="259">when the deal ends unclosed</text><rect class="fas" x="250" y="90" width="180" height="38"/><text class="tb" x="260" y="106">Price and adjustments</text><text class="ts tm" x="260" y="121">price, adjustments, payment</text><rect class="box" x="250" y="160" width="180" height="38"/><text class="tb" x="260" y="176">Closing</text><text class="ts tm" x="260" y="191">deliveries on the day</text><rect class="fas" x="450" y="90" width="210" height="38"/><text class="tb" x="460" y="106">Warranties</text><text class="ts tm" x="460" y="121">seller’s statements of fact</text><rect class="fas" x="450" y="136" width="210" height="38"/><text class="tb" x="460" y="152">Limitations</text><text class="ts tm" x="460" y="167">money and time limits on claims</text><rect class="fas" x="450" y="182" width="210" height="38"/><text class="tb" x="460" y="198">Indemnities and tax</text><text class="ts tm" x="460" y="213">one-for-one cover, tax covenant</text><rect class="box" x="450" y="228" width="210" height="38"/><text class="tb" x="460" y="244">Restrictive covenants</text><text class="ts tm" x="460" y="259">no competing or poaching</text><path class="ln" d="M230 155 H240 V179 H244"/><polygon class="arr" points="250,179 243,175 243,183"/><path class="ln" d="M340 128 V154"/><polygon class="arr" points="340,160 336,153 344,153"/><path class="ln" d="M430 179 H436"/><polygon class="arr" points="443,179 436,175 436,183"/><path class="ln" d="M444 90 V266"/><rect class="box2" x="20" y="282" width="640" height="30"/><text class="tb" x="30" y="301.5">Schedules: the warranty list, limitation detail, closing lists, accounting policies, property, IP</text><rect class="box2" x="20" y="318" width="640" height="30"/><text class="tb" x="30" y="337.5">Boilerplate: notices, assignment, entire agreement, governing law, disputes</text><rect class="fas" x="20" y="360" width="12" height="12"/><text class="ts" x="38" y="370">Carries money</text><rect class="fwarns" x="150" y="360" width="12" height="12"/><text class="ts" x="168" y="370">Deal certainty</text><rect class="box" x="285" y="360" width="12" height="12"/><text class="ts" x="303" y="370">Machinery</text></svg><figcaption><b>Figure 1.</b> Reading the SPA from signing through claims. The money sits in four places (price, warranties, limitations, indemnities) plus the definitions they rely on; conditions and termination decide whether there is a deal at all.</figcaption></figure>
