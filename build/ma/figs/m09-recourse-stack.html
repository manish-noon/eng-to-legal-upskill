<figure class="diagram"><svg viewBox="0 0 680 400" role="img" aria-labelledby="m09f1-t m09f1-d"><title id="m09f1-t">W&amp;I recourse stack for a AED 76m price with a AED 20m policy</title><desc id="m09f1-d">A loss climbs a vertical stack. The first AED 0.5m is the retention, borne by the buyer. The next AED 20m is paid by the insurer. Above AED 20.5m, business warranty losses stay with the buyer, while fundamental warranty losses go to the seller up to the price of AED 76m. Known risks and exclusions sit outside the stack with the seller under specific indemnities backed by escrow; fraud sits outside with the seller, unlimited.</desc>
<text x="20" y="22" class="tl">Loss climbs the stack</text>
<polygon class="arr" points="18,48 12,60 24,60"/><line class="ln" x1="18" y1="60" x2="18" y2="350"/>
<text x="64" y="350" text-anchor="end" class="tn tm">0</text>
<rect class="fbads" x="70" y="310" width="300" height="40"/><text x="82" y="328" class="tb">1. Retention · AED 0.5m</text><text x="82" y="343" class="ts">Buyer (or seller, if SPA cap = retention)</text>
<rect class="fas" x="70" y="170" width="300" height="140"/><text x="82" y="232" class="tb">2. Policy · next AED 20m</text><text x="82" y="250" class="ts">Insurer: unknown breaches of covered warranties</text>
<text x="64" y="314" text-anchor="end" class="tn tm">0.5m</text><text x="64" y="174" text-anchor="end" class="tn tm">20.5m</text>
<rect class="fbads" x="70" y="60" width="148" height="110"/><text x="80" y="96" class="tb">3a. Business</text><text x="80" y="112" class="tb">warranties</text><text x="80" y="132" class="ts">Buyer: nobody</text><text x="80" y="146" class="ts">stands behind it</text>
<rect class="foks" x="222" y="60" width="148" height="110"/><text x="232" y="96" class="tb">3b. Fundamental</text><text x="232" y="112" class="tb">warranties</text><text x="232" y="132" class="ts">Seller, up to the</text><text x="232" y="146" class="ts">price (AED 76m)</text>
<text x="70" y="378" class="ts tm">Layers drawn schematically, not to scale.</text>
<text x="410" y="22" class="tl">Outside the stack</text>
<rect class="box2" x="410" y="60" width="250" height="110"/><text x="422" y="86" class="tb">Known risks and exclusions</text><text x="422" y="108" class="ts">Seller under specific indemnities</text><text x="422" y="124" class="ts">(backed by escrow), or the price</text><text x="422" y="148" class="ts tm">The policy covers the unknown only</text>
<rect class="box2" x="410" y="200" width="250" height="110"/><text x="422" y="226" class="tb">Fraud</text><text x="422" y="248" class="ts">Seller, unlimited</text><text x="422" y="264" class="ts">Insurer pays the buyer, then may</text><text x="422" y="280" class="ts">pursue the seller (subrogation)</text>
</svg><figcaption><b>Figure 1.</b> The recourse stack from the table above: retention, then the policy, then the split above the policy, with known risks and fraud handled outside it.</figcaption></figure>
