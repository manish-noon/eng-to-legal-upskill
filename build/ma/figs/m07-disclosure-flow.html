<figure class="diagram"><svg viewBox="0 0 680 330" role="img" aria-labelledby="m07f1-t m07f1-d"><title id="m07f1-t">From problem to recovery: indemnity, warranty, disclosure</title><desc id="m07f1-d">Decision flow. A problem named in a specific indemnity is reimbursed one for one. Otherwise, if no warranty covers it there is no claim. If a warranty covers it but it was fairly disclosed, there is no claim. If not disclosed, it is a breach giving damages for proven loss, which then pass through the limitations.</desc><rect class="box" x="220.0" y="10" width="240" height="34"/><text class="tb" x="340" y="31.5" text-anchor="middle">A problem surfaces after closing</text><path class="ln" d="M340 44 V63"/><polygon class="arr" points="340,70 336,63 344,63"/><rect class="box2" x="220.0" y="70" width="240" height="36"/><text class="tb" x="340" y="92.5" text-anchor="middle">Named in a specific indemnity?</text><path class="ln" d="M460 88 H493"/><polygon class="arr" points="500,88 493,84 493,92"/><text class="ts tm" x="468" y="82">yes</text><rect class="foks" x="500.0" y="66" width="160" height="44"/><text class="tb" x="580" y="85.0" text-anchor="middle">Indemnity pays</text><text class="ts tm" x="580" y="100.0" text-anchor="middle">one for one, own limits</text><path class="ln" d="M340 106 V133"/><polygon class="arr" points="340,140 336,133 344,133"/><text class="ts tm" x="348" y="126">no</text><rect class="box2" x="220.0" y="140" width="240" height="36"/><text class="tb" x="340" y="162.5" text-anchor="middle">Does a warranty cover it?</text><path class="ln" d="M220 158 H187"/><polygon class="arr" points="180,158 187,154 187,162"/><text class="ts tm" x="190" y="152">no</text><rect class="fbads" x="20.0" y="136" width="160" height="44"/><text class="tb" x="100" y="155.0" text-anchor="middle">No claim</text><text class="ts tm" x="100" y="170.0" text-anchor="middle">the risk stays with you</text><path class="ln" d="M340 176 V203"/><polygon class="arr" points="340,210 336,203 344,203"/><text class="ts tm" x="348" y="196">yes</text><rect class="box2" x="220.0" y="210" width="240" height="36"/><text class="tb" x="340" y="232.5" text-anchor="middle">Fairly disclosed before signing?</text><path class="ln" d="M220 228 H187"/><polygon class="arr" points="180,228 187,224 187,232"/><text class="ts tm" x="190" y="222">yes</text><rect class="fbads" x="20.0" y="202" width="160" height="52"/><text class="tb" x="100" y="217.5" text-anchor="middle">No claim</text><text class="ts tm" x="100" y="232.5" text-anchor="middle">disclosed means known:</text><text class="ts tm" x="100" y="247.5" text-anchor="middle">price, condition or indemnity</text><path class="ln" d="M340 246 V273"/><polygon class="arr" points="340,280 336,273 344,273"/><text class="ts tm" x="348" y="266">no</text><rect class="fas" x="220.0" y="280" width="240" height="36"/><text class="tb" x="340" y="302.5" text-anchor="middle">Breach: damages for proven loss</text><path class="ln" d="M460 298 H493"/><polygon class="arr" points="500,298 493,294 493,302"/><rect class="foks" x="500.0" y="276" width="160" height="44"/><text class="tb" x="580" y="295.0" text-anchor="middle">Recovery</text><text class="ts tm" x="580" y="310.0" text-anchor="middle">after limitations (module 8)</text></svg><figcaption><b>Figure 1.</b> A warranty protects you only against what you were not told. Disclosure turns a breach into a non-claim, so a known issue must go to price, a condition or a specific indemnity before signing.</figcaption></figure>
