="188">Basket: 760k</text><text class="ts tm" x="20" y="203">counting total 900k exceeds it</text><path class="lnm" d="M20 214 H660"/><rect class="fa" x="220" y="178" width="378.9" height="12"/><text class="tn" x="606.9" y="188">tipping 900</text><rect class="fas" x="220" y="194" width="58.9" height="12"/><text class="tn" x="286.9" y="204">deductible 140</text><text class="tb" x="20" y="236">Cap: 15.2m</text><text class="ts tm" x="20" y="251">not reached</text><path class="lnm" d="M20 262 H660"/><rect class="fa" x="220" y="226" width="378.9" height="12"/><text class="tn" x="606.9" y="236">tipping 900</text><rect class="fas" x="220" y="242" width="58.9" height="12"/><text class="tn" x="286.9" y="252">deductible 140</text><path class="lnd" d="M540.0 172 V214"/><text class="ts tm" x="546" y="204">basket 760</text><text class="ts tm" x="660" y="254" text-anchor="end">cap 15,200 is far off this scale</text><text class="tb" x="20" y="290">Seller pays</text><text class="tn ta" x="220" y="290">tipping AED 900k</text><text class="tn" x="400" y="290">deductible AED 140k</text><text class="ts tm" x="560" y="290">6.4 times apart</text></svg><figcaption><b>Figure 1.</b> The worked example through the filters: price AED 76m, de minimis 0.1% (76k), basket 1% (760k), cap 20% (15.2m). One word in the basket clause moves the payout from AED 900k to AED 140k.</figcaption></figure>
