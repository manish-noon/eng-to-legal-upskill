<figure class="diagram"><svg viewBox="0 0 670 350" role="img" aria-labelledby="m05f1-t m05f1-d"><title id="m05f1-t">Routing a diligence finding</title><desc id="m05f1-d">Ask in order: fatal or unlawful, walk away; fixable before closing, make it a condition; known and quantifiable, reduce the price; known but uncertain, specific indemnity; unknown, warranty and disclosure.</desc><rect class="box" x="10" y="20" width="250" height="40"/><text class="tb" x="135" y="45" text-anchor="middle">Fatal to the deal, or unlawful?</text><line class="ln" x1="260" y1="40" x2="352" y2="40"/><polygon class="arr" points="360,40 351,35 351,45"/><text class="ts tm" x="300" y="34" text-anchor="middle">yes</text><rect class="fbads" x="360" y="20" width="300" height="40"/><text class="tb tbad" x="372" y="38">Walk away</text><text class="ts tm" x="372" y="53">no price compensates</text><line class="ln" x1="135" y1="60" x2="135" y2="82"/><polygon class="arr" points="135,90 130,81 140,81"/><text class="ts tm" x="143" y="78">no</text><rect class="box" x="10" y="90" width="250" height="40"/><text class="tb" x="135" y="115" text-anchor="middle">Fixable before closing?</text><line class="ln" x1="260" y1="110" x2="352" y2="110"/><polygon class="arr" points="360,110 351,105 351,115"/><text class="ts tm" x="300" y="104" text-anchor="middle">yes</text><rect class="fas" x="360" y="90" width="300" height="40"/><text class="tb ta" x="372" y="108">Condition precedent / pre-closing fix</text><text class="ts tm" x="372" y="123">removes the risk</text><line class="ln" x1="135" y1="130" x2="135" y2="152"/><polygon class="arr" points="135,160 130,151 140,151"/><text class="ts tm" x="143" y="148">no</text><rect class="box" x="10" y="160" width="250" height="40"/><text class="tb" x="135" y="185" text-anchor="middle">Known and quantifiable?</text><line class="ln" x1="260" y1="180" x2="352" y2="180"/><polygon class="arr" points="360,180 351,175 351,185"/><text class="ts tm" x="300" y="174" text-anchor="middle">yes</text><rect class="foks" x="360" y="160" width="300" height="40"/><text class="tb tok" x="372" y="178">Price reduction</text><text class="ts tm" x="372" y="193">certain, immediate</text><line class="ln" x1="135" y1="200" x2="135" y2="222"/><polygon class="arr" points="135,230 130,221 140,221"/><text class="ts tm" x="143" y="218">no</text><rect class="box" x="10" y="230" width="250" height="40"/><text class="tb" x="135" y="255" text-anchor="middle">Known, amount uncertain?</text><line class="ln" x1="260" y1="250" x2="352" y2="250"/><polygon class="arr" points="360,250 351,245 351,255"/><text class="ts tm" x="300" y="244" text-anchor="middle">yes</text><rect class="fwarns" x="360" y="230" width="300" height="40"/><text class="tb twarn" x="372" y="248">Specific indemnity</text><text class="ts tm" x="372" y="263">1:1, back it with escrow</text><line class="ln" x1="135" y1="270" x2="135" y2="292"/><polygon class="arr" points="135,300 130,291 140,291"/><text class="ts tm" x="143" y="288">no</text><rect class="box2" x="10" y="300" width="250" height="40"/><text class="tb" x="135" y="325" text-anchor="middle">Unknown: nothing found</text><line class="ln" x1="260" y1="320" x2="352" y2="320"/><polygon class="arr" points="360,320 351,315 351,325"/><rect class="box" x="360" y="300" width="300" height="40"/><text class="tb" x="372" y="318">Warranty + disclosure</text><text class="ts tm" x="372" y="333">only for the unknown; disclosed = no claim</text></svg><figcaption><b>Figure 5.1.</b> The decision rule, in order. Each finding gets exactly one primary home. Known problems never rely on a warranty: they will be disclosed against it.</figcaption></figure>
