2" y="38" text-anchor="middle">Closing</text><text class="ts tm" x="532" y="53" text-anchor="middle">shares ↔ money</text><text class="ts tm" x="532" y="66" text-anchor="middle">1 day</text><rect class="box2" x="558" y="86" width="116" height="28"/><text class="tb ts" x="616.0" y="104" text-anchor="middle">Post-closing</text><text class="ts tm" x="616.0" y="134" text-anchor="middle">true-up, claims</text><text class="ts tm" x="616.0" y="148" text-anchor="middle">1–3 yrs; tax longer</text><line class="lnd" x1="10" y1="170" x2="676" y2="170"/><text class="tl" x="10" y="190">Information released and commitment rise left → right · bands not to scale</text></svg><figcaption><b>Figure 3.1.</b> Seven stages, two one-day events. The SPA arrives late; signing binds, closing pays. Durations are rules of thumb, not statistics.</figcaption></figure>
