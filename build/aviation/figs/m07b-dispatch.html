<figure class="diagram"><svg viewBox="0 0 660 188" role="img" aria-labelledby="m07bf1-t m07bf1-d"><title id="m07bf1-t">Two operating plans for the morning flight</title><desc id="m07bf1-d">Bayline possession requires a sublease review. Missing notice holds the handover. Cedar possession and control allow a wet lease review. Release only when all conditions and external permissions are verified.</desc><rect class="box" x="4" y="12" width="176" height="62"/><text class="tb" x="92" y="39" text-anchor="middle">Bayline takes</text><text class="tm" x="92" y="60" text-anchor="middle">possession</text><path class="ln" d="M180 43h33"/><rect class="box2" x="213" y="12" width="200" height="62"/><text class="tb" x="313" y="39" text-anchor="middle">Sublease notice</text><text class="tm" x="313" y="60" text-anchor="middle">deadline missed</text><path class="ln" d="M413 43h33"/><rect class="fwarns" x="446" y="12" width="210" height="62"/><text class="tb" x="551" y="49" text-anchor="middle">Hold handover</text><rect class="box" x="4" y="105" width="176" height="62"/><text class="tb" x="92" y="132" text-anchor="middle">Cedar retains</text><text class="tm" x="92" y="153" text-anchor="middle">possession and control</text><path class="ln" d="M180 136h33"/><rect class="box2" x="213" y="105" width="200" height="62"/><text class="tb" x="313" y="132" text-anchor="middle">Wet lease conditions</text><text class="tm" x="313" y="153" text-anchor="middle">and external approvals</text><path class="ln" d="M413 136h33"/><rect class="foks" x="446" y="105" width="210" height="62"/><text class="tb" x="551" y="132" text-anchor="middle">Release only when</text><text class="tm" x="551" y="153" text-anchor="middle">every check clears</text></svg><figcaption><b>Dispatch decision.</b> Changing who controls the flight changes the permission you must prove.</figcaption></figure>
