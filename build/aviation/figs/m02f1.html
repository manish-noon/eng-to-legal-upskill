<figure class="diagram"><svg viewBox="0 0 680 246" role="img" aria-labelledby="m02f1-t m02f1-d"><title id="m02f1-t">Build the price from dated components</title><desc id="m02f1-d">Twenty million base plus one million escalation plus two million option less one million invoice credit yields twenty-two million dollars.</desc><text x="20" y="25" class="tl" text-anchor="start">ILLUSTRATIVE DELIVERY INVOICE  /  USD MILLIONS</text><text x="20" y="63" class="ts" text-anchor="start">Base price</text><rect x="171" y="48" width="320" height="18" class="fmut"></rect><text x="575" y="63" class="tn" text-anchor="end">20</text><text x="20" y="101" class="ts" text-anchor="start">Escalation</text><rect x="171" y="86" width="16" height="18" class="fa"></rect><text x="575" y="101" class="tn" text-anchor="end">1</text><text x="20" y="139" class="ts" text-anchor="start">Option</text><rect x="171" y="124" width="32" height="18" class="fa"></rect><text x="575" y="139" class="tn" text-anchor="end">2</text><text x="20" y="177" class="ts" text-anchor="start">Invoice credit</text><rect x="171" y="162" width="16" height="18" class="fwarn"></rect><text x="575" y="177" class="tn" text-anchor="end">−1</text><text x="20" y="215" class="ts" text-anchor="start">Delivery price</text><rect x="171" y="200" width="352" height="18" class="fa"></rect><text x="575" y="215" class="tn" text-anchor="end">22</text></svg><figcaption><b>Figure 2.1.</b> Only the base escalates in this example. The immediately usable invoice credit reduces cash due.</figcaption></figure>
