<figure class="diagram"><svg viewBox="0 0 620 145" role="img" aria-labelledby="m05bf1-t m05bf1-d"><title id="m05bf1-t">Three decisions on the closing call</title><desc id="m05bf1-d">The shop verifies the repair. The buyer checks its conditions. Escrow acts on agreed release instructions. Each decision requires different evidence.</desc><rect class="box" x="8" y="30" width="176" height="77"/><rect class="box2" x="222" y="30" width="176" height="77"/><rect class="box" x="436" y="30" width="176" height="77"/><path class="ln" d="M184 68h38m176 0h38"/><text class="tb" x="96" y="60" text-anchor="middle">Shop</text><text class="ts" x="96" y="86" text-anchor="middle">Repair verified?</text><text class="tb" x="310" y="60" text-anchor="middle">Buyer</text><text class="ts" x="310" y="86" text-anchor="middle">Conditions met?</text><text class="tb" x="524" y="60" text-anchor="middle">Escrow</text><text class="ts" x="524" y="86" text-anchor="middle">Release authorized?</text></svg><figcaption><b>Reading the closing call.</b> A shop signature answers the first question. Identify who can answer each remaining question before funds move.</figcaption></figure>
