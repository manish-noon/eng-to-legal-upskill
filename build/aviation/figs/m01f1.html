<figure class="diagram"><svg viewBox="0 0 680 234" role="img" aria-labelledby="m01f1-t m01f1-d"><title id="m01f1-t">Four seats in a financed lease</title><desc id="m01f1-d">A manufacturer passes title to an owner. The owner grants possession to an airline and gives security to its lender.</desc><rect x="12" y="38" width="142" height="54" class="box2"></rect><text x="83.0" y="60" class="tb" text-anchor="middle">Manufacturer</text><text x="83.0" y="79" class="ts" text-anchor="middle">sells the aircraft</text><rect x="275" y="38" width="132" height="54" class="box2"></rect><text x="341.0" y="60" class="tb" text-anchor="middle">Owner / lessor</text><text x="341.0" y="79" class="ts" text-anchor="middle">holds title</text><rect x="531" y="38" width="137" height="54" class="box2"></rect><text x="599.5" y="60" class="tb" text-anchor="middle">Airline / lessee</text><text x="599.5" y="79" class="ts" text-anchor="middle">operates aircraft</text><line x1="154" y1="66" x2="275" y2="66" class="lna"></line><polygon class="arr" points="275,66 268,62 268,70"></polygon><text x="214.5" y="59" class="ts" text-anchor="middle">title</text><line x1="407" y1="66" x2="531" y2="66" class="lna"></line><polygon class="arr" points="531,66 524,62 524,70"></polygon><text x="469.0" y="59" class="ts" text-anchor="middle">possession</text><rect x="274" y="162" width="134" height="54" class="box2"></rect><text x="341.0" y="184" class="tb" text-anchor="middle">Lender</text><text x="341.0" y="203" class="ts" text-anchor="middle">advances cash</text><line x1="321" y1="162" x2="321" y2="92" class="lna"></line><text x="306" y="132" class="ts" text-anchor="end">loan</text><line x1="362" y1="92" x2="362" y2="162" class="ln"></line><text x="374" y="132" class="ts" text-anchor="start">security</text></svg><figcaption><b>Figure 1.1.</b> Follow title, possession and security separately. The airline pays rent to the owner or its designated collection account.</figcaption></figure>
